name: spike-google-flights
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --with fast-flights==3.1.0 --with typing_extensions python spike/pacing.py 6 KIX,NRT,FUK,TPE,HKG,DAD,BKK,CEB,GUM,SYD,LHR,CDG
